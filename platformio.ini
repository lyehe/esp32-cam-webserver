; PlatformIO Project Configuration File for ESP32 CAM Webserver v5.0
; Modernized for ESP32 Arduino Core 3.3.4
; https://docs.platformio.org/page/projectconf.html

; ================================================================
; =                                                              =
; =    ESP32 CAM WEBSERVER v5.0                                  =
; =    Clean Architecture + SOLID Principles                     =
; =                                                              =
; =    Target: ESP32 Arduino Core 3.3.4 (ESP-IDF 5.5)           =
; =    Architecture: Clean Architecture with DI                  =
; =    Features: Multi-client, JWT auth, Rate limiting          =
; =                                                              =
; ================================================================

[platformio]
src_dir = src
test_dir = test
data_dir = data
default_envs = esp32dev

; ================================================================
; Common settings for all environments
; ================================================================
[env]
framework = arduino
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
    log2file

; Required build flags for ESP32 Core 3.x compatibility
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINOJSON_USE_LONG_LONG=1
    -DARDUINOJSON_ENABLE_STD_STRING=1
    -MMD -c
    ; Enable modern C++ features
    -std=gnu++17
    -DESP32_CAM_V5
    -DCONFIG_CAMERA_CORE0
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_USE_WDT=0

; Common library dependencies
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    esp32/ESP32-Camera@^2.0.14
    me-no-dev/ESPAsyncWebServer@^1.2.4
    me-no-dev/AsyncTCP@^1.1.4

; Upload settings
upload_speed = 921600

; ================================================================
; ESP32 (Classic) - AI-THINKER, WROVER Kit
; ================================================================
[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
board_build.partitions = min_spiffs.csv
board_build.filesystem = spiffs

; ESP32-specific flags
build_flags =
    ${env.build_flags}
    -DCAMERA_MODEL_AI_THINKER
    -DCONFIG_FREERTOS_HZ=1000

; OTA upload configuration (uncomment and configure after first upload)
; upload_protocol = espota
; upload_port = esp32-cam.local
; upload_flags =
;     --auth=YourOTAPassword

[env:esp32dev-debug]
extends = env:esp32dev
build_type = debug
build_flags =
    ${env:esp32dev.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DDEBUG_ESP_PORT=Serial
    -DDEBUG_ESP_CORE
    -DDEBUG_ESP_WIFI
    -DDEBUG_ESP_HTTP_SERVER

; ================================================================
; ESP32-S3 - Modern high-performance variant with AI features
; ================================================================
[env:esp32s3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
board_build.partitions = default_16MB.csv
board_build.filesystem = spiffs
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

build_flags =
    ${env.build_flags}
    -DCAMERA_MODEL_ESP32S3_EYE
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_SPEED_80M
    -DCONFIG_SPIRAM_MODE_OCT

; ================================================================
; ESP32-S2 - Lower cost variant
; ================================================================
[env:esp32s2]
platform = espressif32@^6.9.0
board = esp32-s2-saola-1
board_build.partitions = min_spiffs.csv
board_build.filesystem = spiffs
board_build.mcu = esp32s2

build_flags =
    ${env.build_flags}
    -DCAMERA_MODEL_ESP_EYE

; ================================================================
; WROVER Kit - Development board with camera
; ================================================================
[env:esp32wrover]
platform = espressif32@^6.9.0
board = esp-wrover-kit
board_build.partitions = min_spiffs.csv
board_build.filesystem = spiffs

build_flags =
    ${env.build_flags}
    -DCAMERA_MODEL_WROVER_KIT

; ================================================================
; M5Stack Camera - M5STACK Camera module
; ================================================================
[env:m5stack-camera]
platform = espressif32@^6.9.0
board = m5stack-core-esp32
board_build.partitions = min_spiffs.csv
board_build.filesystem = spiffs

build_flags =
    ${env.build_flags}
    -DCAMERA_MODEL_M5STACK_PSRAM

; ================================================================
; Unit Testing Environment
; ================================================================
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -DNATIVE_BUILD

; Mock dependencies for native testing
lib_deps =
    bblanchon/ArduinoJson@^7.2.0

; ================================================================
; Integration Testing on Hardware
; ================================================================
[env:test-esp32]
extends = env:esp32dev
test_framework = unity
test_build_src = yes
test_filter = integration
build_flags =
    ${env:esp32dev.build_flags}
    -DINTEGRATION_TEST

; ================================================================
; OTA Update Environment (after initial flash)
; ================================================================
[env:ota-esp32]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.1.100
; Change IP to your camera's IP address
upload_flags =
    --port=3232
    --auth=YourOTAPassword

[env:ota-esp32s3]
extends = env:esp32s3
upload_protocol = espota
upload_port = 192.168.1.100
upload_flags =
    --port=3232
    --auth=YourOTAPassword

; ================================================================
; Production Release Build (optimized)
; ================================================================
[env:release-esp32]
extends = env:esp32dev
build_type = release
build_flags =
    ${env:esp32dev.build_flags}
    -DCORE_DEBUG_LEVEL=1
    -DNDEBUG
    -Os
    -ffunction-sections
    -fdata-sections
build_unflags =
    -DCORE_DEBUG_LEVEL=3

; ================================================================
; Custom Scripts and Advanced Options
; ================================================================
[common]
; Partition scheme file
board_build.partitions = min_spiffs.csv

; SPIFFS settings
board_build.filesystem = spiffs

; Additional board configuration
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio

; Memory settings
board_upload.flash_size = 4MB
board_upload.maximum_size = 1966080
